name: Colab GPU End-to-End Cloud Trainer

on:
  workflow_dispatch:
    inputs:
      epochs:
        description: 'Number of epochs to train'
        required: true
        default: '300'
        type: string
      batch_size:
        description: 'Batch size'
        required: true
        default: '4'
        type: string
      val_freq:
        description: 'Validation frequency (epochs)'
        required: true
        default: '50'
        type: string
      duration_hours:
        description: 'Maximum cloud runner duration in hours'
        required: true
        default: '5.5'
        type: string

jobs:
  cloud_training:
    name: Colab Cloud GPU Training & Keep-Alive
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Colab CLI & Tools
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          $HOME/.local/bin/uv tool install google-colab-cli
          pip install requests kaggle

      - name: Authenticate Colab CLI
        env:
          COLAB_TOKEN_JSON: ${{ secrets.COLAB_TOKEN_JSON }}
        run: |
          if [ -z "$COLAB_TOKEN_JSON" ]; then
            echo "::error ::COLAB_TOKEN_JSON secret is not set! Please add it to GitHub Repository Secrets."
            exit 1
          fi
          mkdir -p ~/.config/colab-cli
          echo "$COLAB_TOKEN_JSON" > ~/.config/colab-cli/token.json
          chmod 600 ~/.config/colab-cli/token.json
          echo "Colab CLI Identity:"
          colab whoami

      - name: Provision GPU, Deploy Dual Training & Stream Logs
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          python3 scripts/colab_cloud_train.py \
            --epochs "${{ inputs.epochs }}" \
            --batch-size "${{ inputs.batch_size }}" \
            --val-freq "${{ inputs.val_freq }}" \
            --duration-hours "${{ inputs.duration_hours }}" \
            --kaggle-token "$KAGGLE_API_TOKEN"
